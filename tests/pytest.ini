# This file lives in `tests/` rather than at the pack root so that pytest's rootdir *is* this
# directory. A custom-node pack root must be an importable package, and pytest builds a `Package`
# collector for every `__init__.py`-bearing directory between a test file and the rootdir — so with
# the ini one level up it tries to import the pack's `__init__.py` as a top-level module, where its
# relative imports cannot resolve. Keeping the rootdir here stops that walk.
#
# `--import-mode=importlib` for the same reason: the tests are not a package and must not be made
# one. conftest.py loads the pack properly, under a parent name.
[pytest]
addopts = --import-mode=importlib
